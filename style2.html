<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>style2 - 선승범 (22500349)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 20px;
      margin: 0;
      background: #d14836;
      color: #ffffff;
    }

    header {
      color: #ffffff;
      padding: 20px;
      font-size: 15px;
    }

    ul {
      margin: 0;
      padding: 0;
    }

    li {
      width: 155px;
      background: #d14836;
      border: 5px solid #ffffff;
      border-radius: 40px;
      color: #ffffff;
      list-style: none;
      padding: 5px;
      margin: 10px;
      text-align: center;
    }

    main {
      background: #ffffff;
      color: #000000;
      padding: 10px;
      font-size: 80%;
    }

    h2 {
      border: 3px solid #ff0000;
      border-radius: 10px;
      color: #d14836;
      font-size: 120%;
    }

    div {
      background: #f6dad7;
      color: #d14836;
      padding: 10px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 70%;
      color: #ffffff;
    }

    a {
      color: #ffffff;
      text-decoration: none;
    }

  </style>
</head>


<body>
  <!-- ① <header> : h1(제목) + p(안내문) -->
  <header>
    <h1>Welcome to 선승범's Homepage (22500349)</h1>
    <p>Computer Science</p>
  </header>

  <!-- ② <nav> : ul > li 여러 개 > 각 li 안에 a (다른 페이지로 가는 링크) -->
  <!--    링크 대상: index.html(Home) / nostyle.html / style1.html / style2.html / bootstrap_ex.html -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="style1.html">Stylesheet 1</a></li>
      <li><a href="style2.html">Stylesheet 2</a></li>
    </ul>
  </nav>


  <!-- ③ <main> : h2 + p, 그리고 다시 h2 + p (내용 2덩어리) -->
  <main>
    <h2>Style1</h2>
    <p>style1의 페이지 입니다</p>

    <h2>Style2</h2>
    <p>style2의 페이지 입니다</p>
  </main>

  <!-- ④ <div> : h3 + p  ← 명세 '필수 div'를 여기서 만족 (사이드바 역할) -->
  <div>
    <h3>touch me</h3>
    <p>!touch!</p>
  </div>

  <!-- ⑤ <footer> : p (하단 문구, Lorem ipsum 등) -->
  <footer>
    <p>22500349_선승범 · OSS Assignment_02</p>
  </footer>

</body>

</html>
